<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constellation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    #canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      cursor: crosshair;
    }

    /* Drop zone shown before photo is uploaded */
    #drop-zone {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 18px;
      gap: 16px;
    }

    #drop-zone.hidden { display: none; }

    #drop-zone .icon { font-size: 48px; }

    /* UI controls — bottom right */
    #controls {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: none;
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: rgba(20, 20, 30, 0.85);
      border: 1px solid rgba(217, 119, 87, 0.4);
      color: #d97757;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      background: rgba(217, 119, 87, 0.15);
      border-color: #d97757;
    }

    /* hidden file input */
    #file-input { display: none; }

    /* drag-over highlight */
    body.drag-over #drop-zone {
      background: rgba(217, 119, 87, 0.05);
    }
  </style>
</head>
<body>

  <canvas id="canvas" width="1200" height="800"></canvas>

  <div id="drop-zone">
    <div class="icon">📸</div>
    <div>사진을 여기에 드래그하거나 업로드하세요</div>
    <button class="btn" id="upload-btn">사진 선택</button>
  </div>

  <div id="controls">
    <button class="btn" id="upload-btn-2">📁 사진 바꾸기</button>
    <button class="btn" id="save-btn">💾 저장</button>
  </div>

  <input type="file" id="file-input" accept="image/*">

  <script>
    // JS goes here in subsequent tasks
  </script>
</body>
</html>
