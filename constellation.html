<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constellation</title>
  <style>
    :root {
      --color-bg: #0a0a0f;
      --color-accent: #d97757;
      --color-surface: rgba(20, 20, 30, 0.85);
      --color-muted: #888;
      --radius-btn: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--color-bg);
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    #canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      cursor: crosshair;
    }

    /* Drop zone shown before photo is uploaded */
    #drop-zone {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-muted);
      font-size: 18px;
      gap: 16px;
    }

    #drop-zone.hidden { display: none; }

    #drop-zone .icon { font-size: 48px; }

    /* UI controls — bottom right; JS shows this with display:flex after photo loads */
    #controls {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: none; /* flex when visible — set via JS: controls.style.display = 'flex' */
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: var(--color-surface);
      border: 1px solid rgba(217, 119, 87, 0.4);
      color: var(--color-accent);
      padding: 10px 18px;
      border-radius: var(--radius-btn);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      background: rgba(217, 119, 87, 0.15);
      border-color: var(--color-accent);
    }

    /* hidden file input */
    #file-input { display: none; }

    /* drag-over highlight */
    body.drag-over #drop-zone {
      background: rgba(217, 119, 87, 0.05);
    }
  </style>
</head>
<body>

  <canvas id="canvas" width="1200" height="800"></canvas>

  <div id="drop-zone">
    <div class="icon">📸</div>
    <div>사진을 여기에 드래그하거나 업로드하세요</div>
    <button class="btn" id="upload-btn">사진 선택</button>
  </div>

  <div id="controls">
    <button class="btn" id="upload-btn-2">📁 사진 바꾸기</button>
    <button class="btn" id="save-btn">💾 저장</button>
  </div>

  <input type="file" id="file-input" accept="image/*">

  <script>
// ─── Seeded PRNG (mulberry32) ─────────────────────────────────────────────────
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  seed: 42,
  photo: null,       // HTMLImageElement
  dots: [],          // [{x, y}]
  connections: [],   // [[indexA, indexB]]
  selected: null,    // dot index or null
};

// ─── Canvas refs ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const dropZone = document.getElementById('drop-zone');
const controls = document.getElementById('controls');

// ─── Photo loading ────────────────────────────────────────────────────────────
function loadPhoto(file) {
  if (!file || !file.type.startsWith('image/')) return;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    state.photo = img;

    // Fit photo to viewport while preserving aspect ratio
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const ratio = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
    canvas.width  = Math.round(img.naturalWidth  * ratio);
    canvas.height = Math.round(img.naturalHeight * ratio);

    dropZone.classList.add('hidden');
    controls.style.display = 'flex';
    generateDots();
    render();
    URL.revokeObjectURL(url);
  };

  img.src = url;
}

// ─── Drag & drop ─────────────────────────────────────────────────────────────
document.addEventListener('dragover', (e) => {
  e.preventDefault();
  document.body.classList.add('drag-over');
});

document.addEventListener('dragleave', (e) => {
  if (e.relatedTarget === null) document.body.classList.remove('drag-over');
});

document.addEventListener('drop', (e) => {
  e.preventDefault();
  document.body.classList.remove('drag-over');
  loadPhoto(e.dataTransfer.files[0]);
});

// ─── File input ───────────────────────────────────────────────────────────────
const fileInput = document.getElementById('file-input');
fileInput.addEventListener('change', () => {
  loadPhoto(fileInput.files[0]);
  fileInput.value = '';
});

document.getElementById('upload-btn').addEventListener('click',  () => fileInput.click());
document.getElementById('upload-btn-2').addEventListener('click', () => fileInput.click());

canvas.addEventListener('click', (e) => {
  if (!state.photo) return; // ignore clicks before photo is loaded

  // Convert screen coords → canvas coords (handles CSS scaling)
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top)  * scaleY;

  const hit = findDotAt(x, y);

  if (hit === null) {
    // Clicked empty space — deselect
    state.selected = null;
  } else if (state.selected === null) {
    // No dot selected yet — select this one
    state.selected = hit;
  } else if (state.selected === hit) {
    // Clicked same dot — deselect
    state.selected = null;
  } else {
    // Second dot clicked — add connection (skip if pair already exists)
    const a = state.selected, b = hit;
    const exists = state.connections.some(([i, j]) => (i === a && j === b) || (i === b && j === a));
    if (!exists) state.connections.push([a, b]);
    state.selected = null;
  }

  render();
});

document.getElementById('save-btn').addEventListener('click', () => {
  if (!state.photo) return;

  const link = document.createElement('a');
  link.download = `constellation-${state.seed}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

canvas.addEventListener('mousemove', (e) => {
  if (!state.photo) return;

  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width  / rect.width);
  const y = (e.clientY - rect.top)  * (canvas.height / rect.height);

  canvas.style.cursor = findDotAt(x, y) !== null ? 'pointer' : 'crosshair';
});

// ─── Render (stub — draws photo only for now) ─────────────────────────────────
function generateDots() {
  const rand = mulberry32(state.seed);
  const pad = 50;  // keep dots away from edges
  state.dots = Array.from({ length: 15 }, () => ({
    x: pad + rand() * (canvas.width  - pad * 2),
    y: pad + rand() * (canvas.height - pad * 2),
  }));
}

function findDotAt(x, y) {
  const HIT = 22; // hit radius in canvas pixels — slightly larger than dot
  for (let i = 0; i < state.dots.length; i++) {
    const dx = state.dots[i].x - x;
    const dy = state.dots[i].y - y;
    if (dx * dx + dy * dy <= HIT * HIT) return i;
  }
  return null;
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Photo
  if (state.photo) {
    ctx.drawImage(state.photo, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // 2. Lines
  if (state.connections.length > 0) {
    ctx.strokeStyle = '#d97757';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#d97757';
    ctx.shadowBlur = 10;
    ctx.lineCap = 'round';

    for (const [i, j] of state.connections) {
      ctx.beginPath();
      ctx.moveTo(state.dots[i].x, state.dots[i].y);
      ctx.lineTo(state.dots[j].x, state.dots[j].y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
  }

  // 3. Dots
  for (let i = 0; i < state.dots.length; i++) {
    const { x, y } = state.dots[i];
    const isSelected = state.selected === i;

    ctx.beginPath();
    ctx.arc(x, y, isSelected ? 9 : 7, 0, Math.PI * 2);
    ctx.fillStyle = '#d97757';
    ctx.shadowColor = isSelected ? '#ff9944' : '#d97757';
    ctx.shadowBlur = isSelected ? 24 : 14;
    ctx.fill();
  }

  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent'; // reset shadow so it doesn't bleed into lines (Task 4)
}
  </script>
</body>
</html>
