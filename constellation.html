<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constellation</title>
  <style>
    :root {
      --color-bg: #0a0a0f;
      --color-accent: #a855f7;
      --color-surface: rgba(20, 20, 30, 0.85);
      --color-muted: #888;
      --radius-btn: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--color-bg);
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    #canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }

    /* Drop zone shown before photo is uploaded */
    #drop-zone {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-muted);
      font-size: 18px;
      gap: 16px;
    }

    #drop-zone.hidden { display: none; }
    #drop-zone .icon { font-size: 48px; }

    /* Hint bar — top center, shown after photo loads */
    #hint {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      background: var(--color-surface);
      padding: 8px 18px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(168, 85, 247, 0.3);
      display: none;
      white-space: nowrap;
    }

    /* UI controls — bottom right */
    #controls {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: none; /* flex when visible */
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: var(--color-surface);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: var(--color-accent);
      padding: 10px 18px;
      border-radius: var(--radius-btn);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      background: rgba(168, 85, 247, 0.15);
      border-color: var(--color-accent);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #file-input { display: none; }

    body.drag-over #drop-zone {
      background: rgba(168, 85, 247, 0.05);
    }
  </style>
</head>
<body>

  <canvas id="canvas" width="1200" height="800"></canvas>

  <div id="drop-zone">
    <div class="icon">📸</div>
    <div>사진을 여기에 드래그하거나 업로드하세요</div>
    <button class="btn" id="upload-btn">사진 선택</button>
  </div>

  <div id="hint"></div>

  <div id="controls">
    <button class="btn" id="connect-btn" disabled>✦ 선 잇기</button>
    <button class="btn" id="upload-btn-2">📁 사진 바꾸기</button>
    <button class="btn" id="save-btn">💾 저장</button>
  </div>

  <input type="file" id="file-input" accept="image/*">

  <script>
// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  photo: null,         // HTMLImageElement
  mode: 'placing',     // 'placing' | 'connecting'
  dots: [],            // [{x, y}]
  connections: [],     // [[indexA, indexB]] — sequential: [0,1],[1,2],...
  dragging: false,
  dragPos: null,       // {x, y} while dragging
};

const MAX_DOTS = 15;

// ─── Canvas refs ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const dropZone = document.getElementById('drop-zone');
const controls = document.getElementById('controls');
const hintEl = document.getElementById('hint');
const connectBtn = document.getElementById('connect-btn');

// ─── Hint text ────────────────────────────────────────────────────────────────
function updateHint() {
  if (!state.photo) { hintEl.style.display = 'none'; return; }

  hintEl.style.display = 'block';
  if (state.mode === 'placing') {
    const remaining = MAX_DOTS - state.dots.length;
    if (state.dots.length === 0) {
      hintEl.textContent = '사진을 클릭해서 점을 찍으세요';
    } else if (remaining > 0) {
      hintEl.textContent = `${state.dots.length}개 찍음 · 최대 ${MAX_DOTS}개`;
    } else {
      hintEl.textContent = '점 15개 완성 — 선 잇기를 눌러보세요';
    }
  } else {
    const nextFrom = state.connections.length;
    if (nextFrom >= state.dots.length - 1) {
      hintEl.textContent = '완성! 💾 저장으로 PNG 다운로드';
    } else {
      hintEl.textContent = `${nextFrom + 1}번 점에서 드래그 → ${nextFrom + 2}번 점으로`;
    }
  }
}

// ─── Photo loading ────────────────────────────────────────────────────────────
function loadPhoto(file) {
  if (!file || !file.type.startsWith('image/')) return;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    state.photo = img;

    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const ratio = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
    canvas.width  = Math.round(img.naturalWidth  * ratio);
    canvas.height = Math.round(img.naturalHeight * ratio);

    state.mode = 'placing';
    state.dots = [];
    state.connections = [];
    state.dragging = false;
    state.dragPos = null;

    dropZone.classList.add('hidden');
    controls.style.display = 'flex';
    connectBtn.disabled = true;

    render();
    updateHint();
    URL.revokeObjectURL(url);
  };

  img.src = url;
}

// ─── Drag & drop (photo upload) ───────────────────────────────────────────────
document.addEventListener('dragover', (e) => {
  e.preventDefault();
  document.body.classList.add('drag-over');
});

document.addEventListener('dragleave', (e) => {
  if (e.relatedTarget === null) document.body.classList.remove('drag-over');
});

document.addEventListener('drop', (e) => {
  e.preventDefault();
  document.body.classList.remove('drag-over');
  loadPhoto(e.dataTransfer.files[0]);
});

// ─── File input ───────────────────────────────────────────────────────────────
const fileInput = document.getElementById('file-input');
fileInput.addEventListener('change', () => {
  loadPhoto(fileInput.files[0]);
  fileInput.value = '';
});

document.getElementById('upload-btn').addEventListener('click',  () => fileInput.click());
document.getElementById('upload-btn-2').addEventListener('click', () => fileInput.click());

// ─── "선 잇기" button — switch to connecting mode ─────────────────────────────
connectBtn.addEventListener('click', () => {
  if (state.dots.length < 2) return;
  state.mode = 'connecting';
  state.connections = [];
  connectBtn.disabled = true;
  render();
  updateHint();
});

// ─── Canvas coord helper ──────────────────────────────────────────────────────
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width  / rect.width),
    y: (e.clientY - rect.top)  * (canvas.height / rect.height),
  };
}

// ─── Hit test ─────────────────────────────────────────────────────────────────
function findDotAt(x, y) {
  const HIT = 22;
  for (let i = 0; i < state.dots.length; i++) {
    const dx = state.dots[i].x - x;
    const dy = state.dots[i].y - y;
    if (dx * dx + dy * dy <= HIT * HIT) return i;
  }
  return null;
}

// ─── Canvas events ────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', (e) => {
  if (!state.photo) return;
  const { x, y } = getCanvasPos(e);

  if (state.mode === 'connecting') {
    const nextFrom = state.connections.length;
    if (nextFrom >= state.dots.length - 1) return;
    if (findDotAt(x, y) === nextFrom) {
      state.dragging = true;
      state.dragPos = { x, y };
      render();
    }
  }
});

canvas.addEventListener('click', (e) => {
  if (!state.photo || state.mode !== 'placing') return;
  if (state.dots.length >= MAX_DOTS) return;

  const { x, y } = getCanvasPos(e);
  state.dots.push({ x, y });

  connectBtn.disabled = state.dots.length < 2;
  render();
  updateHint();
});

canvas.addEventListener('mousemove', (e) => {
  if (!state.photo) return;
  const { x, y } = getCanvasPos(e);

  if (state.mode === 'placing') {
    canvas.style.cursor = state.dots.length < MAX_DOTS ? 'crosshair' : 'default';
    return;
  }

  // connecting mode
  if (state.dragging) {
    state.dragPos = { x, y };
    render();
    canvas.style.cursor = 'crosshair';
  } else {
    const nextFrom = state.connections.length;
    const hit = findDotAt(x, y);
    canvas.style.cursor = (hit === nextFrom && nextFrom < state.dots.length - 1) ? 'grab' : 'default';
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (!state.photo || !state.dragging) return;
  const { x, y } = getCanvasPos(e);
  const nextFrom = state.connections.length;
  const nextTo = nextFrom + 1;

  if (findDotAt(x, y) === nextTo) {
    state.connections.push([nextFrom, nextTo]);
    updateHint();
  }

  state.dragging = false;
  state.dragPos = null;
  render();
});

// ─── Save ─────────────────────────────────────────────────────────────────────
document.getElementById('save-btn').addEventListener('click', () => {
  if (!state.photo) return;
  const link = document.createElement('a');
  link.download = `constellation.png`;
  link.href = canvas.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
});

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Photo
  if (state.photo) {
    ctx.drawImage(state.photo, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // 2. Completed lines
  if (state.connections.length > 0) {
    ctx.strokeStyle = '#a855f7';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#a855f7';
    ctx.shadowBlur = 10;
    ctx.lineCap = 'round';
    for (const [i, j] of state.connections) {
      ctx.beginPath();
      ctx.moveTo(state.dots[i].x, state.dots[i].y);
      ctx.lineTo(state.dots[j].x, state.dots[j].y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
  }

  // 3. Drag preview
  if (state.dragging && state.dragPos) {
    const from = state.dots[state.connections.length];
    ctx.strokeStyle = '#a855f7';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#a855f7';
    ctx.shadowBlur = 6;
    ctx.lineCap = 'round';
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(state.dragPos.x, state.dragPos.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
  }

  // 4. Dots + number labels
  const nextFrom = state.mode === 'connecting' ? state.connections.length : -1;
  ctx.font = 'bold 12px system-ui';

  for (let i = 0; i < state.dots.length; i++) {
    const { x, y } = state.dots[i];
    const isNext = i === nextFrom && nextFrom < state.dots.length - 1;
    const radius = isNext ? 9 : 7;

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = '#a855f7';
    ctx.shadowColor = isNext ? '#d8b4fe' : '#a855f7';
    ctx.shadowBlur = isNext ? 22 : 12;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';

    // Number label
    ctx.fillStyle = '#ffffff';
    ctx.fillText(i + 1, x + 11, y - 7);
  }
}
  </script>
</body>
</html>
