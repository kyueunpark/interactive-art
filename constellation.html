<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constellation</title>
  <style>
    :root {
      --color-bg: #0a0a0f;
      --color-accent: #a855f7;
      --color-surface: rgba(20, 20, 30, 0.85);
      --color-muted: #888;
      --radius-btn: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--color-bg);
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    #canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      cursor: default;
    }

    /* Drop zone shown before photo is uploaded */
    #drop-zone {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-muted);
      font-size: 18px;
      gap: 16px;
    }

    #drop-zone.hidden { display: none; }

    #drop-zone .icon { font-size: 48px; }

    /* UI controls — bottom right; JS shows this with display:flex after photo loads */
    #controls {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: none; /* flex when visible — set via JS: controls.style.display = 'flex' */
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: var(--color-surface);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: var(--color-accent);
      padding: 10px 18px;
      border-radius: var(--radius-btn);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      background: rgba(168, 85, 247, 0.15);
      border-color: var(--color-accent);
    }

    /* hidden file input */
    #file-input { display: none; }

    /* drag-over highlight */
    body.drag-over #drop-zone {
      background: rgba(168, 85, 247, 0.05);
    }
  </style>
</head>
<body>

  <canvas id="canvas" width="1200" height="800"></canvas>

  <div id="drop-zone">
    <div class="icon">📸</div>
    <div>사진을 여기에 드래그하거나 업로드하세요</div>
    <button class="btn" id="upload-btn">사진 선택</button>
  </div>

  <div id="controls">
    <button class="btn" id="upload-btn-2">📁 사진 바꾸기</button>
    <button class="btn" id="save-btn">💾 저장</button>
  </div>

  <input type="file" id="file-input" accept="image/*">

  <script>
// ─── Seeded PRNG (mulberry32) ─────────────────────────────────────────────────
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  seed: 42,
  photo: null,       // HTMLImageElement
  dots: [],          // [{x, y}]
  connections: [],   // [[indexA, indexB]] — always sequential: [0,1],[1,2],...
  dragging: false,
  dragPos: null,     // {x, y} current mouse position while dragging
};

// ─── Canvas refs ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const dropZone = document.getElementById('drop-zone');
const controls = document.getElementById('controls');

// ─── Edge detection (Sobel) for contour-based dot placement ──────────────────
function detectEdgePixels(imageData, width, height) {
  const data = imageData.data;
  const edges = [];
  const pad = 50;

  const getLum = (x, y) => {
    const i = (y * width + x) * 4;
    return 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
  };

  for (let y = pad; y < height - pad; y++) {
    for (let x = pad; x < width - pad; x++) {
      const gx =
        -getLum(x-1, y-1) + getLum(x+1, y-1) +
        -2 * getLum(x-1, y) + 2 * getLum(x+1, y) +
        -getLum(x-1, y+1) + getLum(x+1, y+1);
      const gy =
        -getLum(x-1, y-1) - 2 * getLum(x, y-1) - getLum(x+1, y-1) +
        getLum(x-1, y+1) + 2 * getLum(x, y+1) + getLum(x+1, y+1);
      const mag = Math.sqrt(gx * gx + gy * gy);
      if (mag > 40) edges.push({ x, y });
    }
  }
  return edges;
}

// ─── Photo loading ────────────────────────────────────────────────────────────
function loadPhoto(file) {
  if (!file || !file.type.startsWith('image/')) return;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    state.photo = img;

    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const ratio = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
    canvas.width  = Math.round(img.naturalWidth  * ratio);
    canvas.height = Math.round(img.naturalHeight * ratio);

    state.connections = [];
    state.dragging = false;
    state.dragPos = null;
    dropZone.classList.add('hidden');
    controls.style.display = 'flex';
    generateDots();
    render();
    URL.revokeObjectURL(url);
  };

  img.src = url;
}

// ─── Drag & drop (photo upload) ───────────────────────────────────────────────
document.addEventListener('dragover', (e) => {
  e.preventDefault();
  document.body.classList.add('drag-over');
});

document.addEventListener('dragleave', (e) => {
  if (e.relatedTarget === null) document.body.classList.remove('drag-over');
});

document.addEventListener('drop', (e) => {
  e.preventDefault();
  document.body.classList.remove('drag-over');
  loadPhoto(e.dataTransfer.files[0]);
});

// ─── File input ───────────────────────────────────────────────────────────────
const fileInput = document.getElementById('file-input');
fileInput.addEventListener('change', () => {
  loadPhoto(fileInput.files[0]);
  fileInput.value = '';
});

document.getElementById('upload-btn').addEventListener('click',  () => fileInput.click());
document.getElementById('upload-btn-2').addEventListener('click', () => fileInput.click());

// ─── Canvas interaction — drag to connect in sequence ────────────────────────
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width  / rect.width),
    y: (e.clientY - rect.top)  * (canvas.height / rect.height),
  };
}

canvas.addEventListener('mousedown', (e) => {
  if (!state.photo) return;
  const { x, y } = getCanvasPos(e);
  const nextFrom = state.connections.length;
  if (nextFrom >= state.dots.length - 1) return; // all connected
  if (findDotAt(x, y) === nextFrom) {
    state.dragging = true;
    state.dragPos = { x, y };
    render();
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!state.photo) return;
  const { x, y } = getCanvasPos(e);

  if (state.dragging) {
    state.dragPos = { x, y };
    render();
  }

  const nextFrom = state.connections.length;
  const hit = findDotAt(x, y);
  if (state.dragging) {
    canvas.style.cursor = 'crosshair';
  } else {
    canvas.style.cursor = (hit === nextFrom && nextFrom < state.dots.length - 1) ? 'grab' : 'default';
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (!state.photo || !state.dragging) return;
  const { x, y } = getCanvasPos(e);
  const nextFrom = state.connections.length;
  const nextTo = nextFrom + 1;
  if (findDotAt(x, y) === nextTo) {
    state.connections.push([nextFrom, nextTo]);
  }
  state.dragging = false;
  state.dragPos = null;
  render();
});

// ─── Save ─────────────────────────────────────────────────────────────────────
document.getElementById('save-btn').addEventListener('click', () => {
  if (!state.photo) return;
  const link = document.createElement('a');
  link.download = `constellation-${state.seed}.png`;
  link.href = canvas.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
});

// ─── Dot generation (contour-based) & hit-testing ────────────────────────────
function generateDots() {
  // Draw photo to offscreen canvas to read pixel data
  const offscreen = document.createElement('canvas');
  offscreen.width = canvas.width;
  offscreen.height = canvas.height;
  const octx = offscreen.getContext('2d');
  octx.drawImage(state.photo, 0, 0, canvas.width, canvas.height);
  const imageData = octx.getImageData(0, 0, canvas.width, canvas.height);

  const edges = detectEdgePixels(imageData, canvas.width, canvas.height);

  const rand = mulberry32(state.seed);
  const minDist = Math.min(canvas.width, canvas.height) / 7;
  const dots = [];

  // Fisher-Yates shuffle with seeded PRNG to randomise which edge pixels we pick
  for (let i = edges.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [edges[i], edges[j]] = [edges[j], edges[i]];
  }

  // Pick spread-out points from edge pixels
  for (const candidate of edges) {
    if (dots.length >= 15) break;
    const tooClose = dots.some(d => {
      const dx = d.x - candidate.x;
      const dy = d.y - candidate.y;
      return dx * dx + dy * dy < minDist * minDist;
    });
    if (!tooClose) dots.push({ x: candidate.x, y: candidate.y });
  }

  // Fallback: fill remaining slots with random dots if edge detection didn't yield enough
  const pad = 50;
  while (dots.length < 15) {
    dots.push({
      x: pad + rand() * (canvas.width  - pad * 2),
      y: pad + rand() * (canvas.height - pad * 2),
    });
  }

  state.dots = dots;
}

function findDotAt(x, y) {
  const HIT = 22;
  for (let i = 0; i < state.dots.length; i++) {
    const dx = state.dots[i].x - x;
    const dy = state.dots[i].y - y;
    if (dx * dx + dy * dy <= HIT * HIT) return i;
  }
  return null;
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Photo
  if (state.photo) {
    ctx.drawImage(state.photo, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // 2. Completed lines
  if (state.connections.length > 0) {
    ctx.strokeStyle = '#a855f7';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#a855f7';
    ctx.shadowBlur = 10;
    ctx.lineCap = 'round';
    for (const [i, j] of state.connections) {
      ctx.beginPath();
      ctx.moveTo(state.dots[i].x, state.dots[i].y);
      ctx.lineTo(state.dots[j].x, state.dots[j].y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
  }

  // 3. Drag preview (dashed line from current dot to mouse)
  if (state.dragging && state.dragPos) {
    const from = state.dots[state.connections.length];
    ctx.strokeStyle = '#a855f7';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#a855f7';
    ctx.shadowBlur = 6;
    ctx.lineCap = 'round';
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(state.dragPos.x, state.dragPos.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
  }

  // 4. Dots + number labels
  const nextFrom = state.connections.length;
  ctx.font = 'bold 12px system-ui';

  for (let i = 0; i < state.dots.length; i++) {
    const { x, y } = state.dots[i];
    const isNext = i === nextFrom && nextFrom < state.dots.length - 1;
    const radius = isNext ? 9 : 7;

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = '#a855f7';
    ctx.shadowColor = isNext ? '#d8b4fe' : '#a855f7';
    ctx.shadowBlur = isNext ? 22 : 12;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';

    // Number label
    ctx.fillStyle = '#ffffff';
    ctx.fillText(i + 1, x + 11, y - 7);
  }
}
  </script>
</body>
</html>
