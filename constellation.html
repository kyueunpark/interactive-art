<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constellation</title>
  <style>
    :root {
      --color-bg: #0a0a0f;
      --color-accent: #d97757;
      --color-surface: rgba(20, 20, 30, 0.85);
      --color-muted: #888;
      --radius-btn: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--color-bg);
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    #canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      cursor: crosshair;
    }

    /* Drop zone shown before photo is uploaded */
    #drop-zone {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-muted);
      font-size: 18px;
      gap: 16px;
    }

    #drop-zone.hidden { display: none; }

    #drop-zone .icon { font-size: 48px; }

    /* UI controls — bottom right; JS shows this with display:flex after photo loads */
    #controls {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: none; /* flex when visible — set via JS: controls.style.display = 'flex' */
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: var(--color-surface);
      border: 1px solid rgba(217, 119, 87, 0.4);
      color: var(--color-accent);
      padding: 10px 18px;
      border-radius: var(--radius-btn);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      background: rgba(217, 119, 87, 0.15);
      border-color: var(--color-accent);
    }

    /* hidden file input */
    #file-input { display: none; }

    /* drag-over highlight */
    body.drag-over #drop-zone {
      background: rgba(217, 119, 87, 0.05);
    }
  </style>
</head>
<body>

  <canvas id="canvas" width="1200" height="800"></canvas>

  <div id="drop-zone">
    <div class="icon">📸</div>
    <div>사진을 여기에 드래그하거나 업로드하세요</div>
    <button class="btn" id="upload-btn">사진 선택</button>
  </div>

  <div id="controls">
    <button class="btn" id="upload-btn-2">📁 사진 바꾸기</button>
    <button class="btn" id="save-btn">💾 저장</button>
  </div>

  <input type="file" id="file-input" accept="image/*">

  <script>
// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  seed: 42,
  photo: null,       // HTMLImageElement
  dots: [],          // [{x, y}]
  connections: [],   // [[indexA, indexB]]
  selected: null,    // dot index or null
};

// ─── Canvas refs ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const dropZone = document.getElementById('drop-zone');
const controls = document.getElementById('controls');

// ─── Photo loading ────────────────────────────────────────────────────────────
function loadPhoto(file) {
  if (!file || !file.type.startsWith('image/')) return;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    state.photo = img;

    // Fit photo to viewport while preserving aspect ratio
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const ratio = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
    canvas.width  = Math.round(img.naturalWidth  * ratio);
    canvas.height = Math.round(img.naturalHeight * ratio);

    dropZone.classList.add('hidden');
    controls.style.display = 'flex';
    generateDots();
    render();
    URL.revokeObjectURL(url);
  };

  img.src = url;
}

// ─── Drag & drop ─────────────────────────────────────────────────────────────
document.addEventListener('dragover', (e) => {
  e.preventDefault();
  document.body.classList.add('drag-over');
});

document.addEventListener('dragleave', (e) => {
  if (e.relatedTarget === null) document.body.classList.remove('drag-over');
});

document.addEventListener('drop', (e) => {
  e.preventDefault();
  document.body.classList.remove('drag-over');
  loadPhoto(e.dataTransfer.files[0]);
});

// ─── File input ───────────────────────────────────────────────────────────────
const fileInput = document.getElementById('file-input');
fileInput.addEventListener('change', () => loadPhoto(fileInput.files[0]));

document.getElementById('upload-btn').addEventListener('click',  () => fileInput.click());
document.getElementById('upload-btn-2').addEventListener('click', () => fileInput.click());

// ─── Render (stub — draws photo only for now) ─────────────────────────────────
function generateDots() {}  // stub — replaced in Task 3

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (state.photo) {
    ctx.drawImage(state.photo, 0, 0, canvas.width, canvas.height);
  }
}
  </script>
</body>
</html>
